name: Client – Android

# Fires only when Android-affecting files change (shared/ counts: it ships
# in the APK). iOS-only edits never spend a minute here.
on:
  push:
    branches: [v2]
    paths: [client/androidApp/**, client/shared/**, client/gradle/**, client/build-logic/**, client/settings.gradle.kts, client/build.gradle.kts, client/gradle.properties, .github/workflows/client-android.yml]
  pull_request:
    branches: [v2]
    paths: [client/androidApp/**, client/shared/**, client/gradle/**, client/build-logic/**, client/settings.gradle.kts, client/build.gradle.kts, client/gradle.properties, .github/workflows/client-android.yml]

# A second push cancels the stale run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache + daemon tuning
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (fast gate; assemble runs only on green)
        run: ./gradlew :shared:jvmTest --console=plain

  assemble:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      # Full history: the Kover delta step diffs origin/<base>...HEAD, which
      # needs the base branch present (default checkout is depth 1).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache + daemon tuning
        uses: gradle/actions/setup-gradle@v6

      # NOTE: android-actions/setup-android is intentionally NOT used — v3
      # hardcodes the long-removed `tools` SDK package, so its own sdkmanager
      # call exits 1 on current runners. ubuntu runners preinstall the SDK at
      # /usr/local/lib/android/sdk; we only add the platform + build-tools
      # this project pins. (Deliberately not cached: gigabytes to restore
      # vs ~1 min to download. Xcode/Gradle-config caches skipped likewise.)
      - name: Set up Android SDK (preinstalled + install platform-36)
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          CMDLINE_BIN=$(dirname "$(find $ANDROID_HOME/cmdline-tools -maxdepth 3 -name sdkmanager | head -1)")
          echo "$CMDLINE_BIN" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          # NOTE: $GITHUB_PATH takes effect only in LATER steps — invoke via
          # absolute path within this step (bare `sdkmanager` is exit 127 here).
          yes | "$CMDLINE_BIN/sdkmanager" --licenses > /dev/null
          "$CMDLINE_BIN/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Assemble shared targets + debug APK
        run: ./gradlew :shared:assemble :androidApp:assembleDebug --console=plain

      # Gating: baselines absorb triaged findings (lint: 3 suppressed IDs in
      # lint-baseline.xml; detekt: 531 IDs in config/detekt/baseline.xml —
      # both verified green locally), so only NEW issues fail these steps.
      # The no-growth guard trips first if a baseline silently absorbed
      # findings (caps in tools/baseline-guard.sh; `make baseline-guard`
      # locally). Deliberately no `continue-on-error`: growth fails the run.
      # Uploads use `if: always()` so reports attach even when the gate trips.
      - name: Baseline no-growth guard (gating)
        run: ./tools/baseline-guard.sh

      - name: Android Lint (gating, baselined)
        run: ./gradlew :androidApp:lintDebug --console=plain

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            client/androidApp/build/reports/lint-results-debug.*
            client/androidApp/lint-baseline.xml

      - name: detekt (gating, baselined)
        run: ./gradlew detekt --console=plain

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: client/**/build/reports/detekt/

      # Advisory: ktlint logs ~4080 violations (format never run) — stays
      # green via ignoreFailures. Triage plan in ARCHITECTURE.md section 5.
      - name: ktlintCheck (advisory)
        continue-on-error: true
        run: ./gradlew ktlintCheck --console=plain

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: client/**/build/reports/ktlint/

      # Report-only: no verification bounds set.
      - name: Kover XML report (report-only)
        continue-on-error: true
        run: ./gradlew :shared:koverXmlReport --console=plain

      - name: Upload Kover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: client/shared/build/reports/kover/

      # Advisory: changed-lines coverage for this PR (tools/kover_delta.py).
      # Report-only like the Kover report above — never fails the build;
      # gating waits for triaged delta data.
      - name: Kover delta coverage (advisory)
        continue-on-error: true
        run: |
          python3 tools/kover_delta.py
          echo "--- delta report ---"
          cat build/kover-delta/delta.txt

      - name: Upload Kover delta report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-delta
          path: client/build/kover-delta/

      # Advisory: warn-only via the count/threshold switch in the root
      # build file (findings land in the report, never fail the build).
      # Ephemeral lockfiles (scan-only -PosvLocks), deleted afterwards —
      # none committed. Scheduled-scan follow-up in ARCHITECTURE.md section 5.
      - name: OSV-Scanner (advisory, warn-only)
        continue-on-error: true
        run: |
          ./gradlew dependencies :shared:dependencies :androidApp:dependencies --write-locks -PosvLocks --console=plain
          ./gradlew osvScan --console=plain
          rm -f gradle.lockfile settings-gradle.lockfile shared/gradle.lockfile androidApp/gradle.lockfile

      - name: Upload OSV SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-sarif
          path: client/build/osv-scanner/
