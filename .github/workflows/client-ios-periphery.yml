name: Client – iOS Periphery

# Off the PR path: the Periphery scan takes ~1s but its job duplicates ~55s
# setup + a full indexed build on macOS minutes (10x). Runs weekly + manual
# + post-merge (push) only — never on pull_request.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [v2]
    paths: [client/iosApp/**, client/shared/**, client/gradle/**, client/build-logic/**, client/settings.gradle.kts, client/build.gradle.kts, client/gradle.properties, .github/workflows/client-ios-periphery.yml]

# A second push cancels the stale run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Periphery needs the index store, but the main iOS build keeps
  # COMPILER_INDEX_STORE_ENABLE=NO (local Xcode intelligence parity, faster
  # CI). This job redoes setup through pod install, builds once with the
  # index store ON, then scans --skip-build.
  # Advisory until baselines are triaged (then promotes to gating).
  periphery:
    # Same pinned image as the iOS build — Periphery results must come from
    # the same toolchain as the build they annotate.
    runs-on: macos-26
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache + daemon tuning
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode + show simulators
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q "^Xcode 26.6$" || { echo "Pinned Xcode 26.6 missing — bump runs-on and this assertion together, then triage any new diagnostics"; exit 1; }
          swift --version
          xcrun simctl list runtimes

      - name: Generate shared podspec + dummy framework
        run: ./gradlew :shared:podspec :shared:generateDummyFramework --console=plain

      - name: Cache CocoaPods (keyed by lockfile; skip on Podfile changes)
        uses: actions/cache@v6
        with:
          path: |
            client/iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('client/iosApp/Podfile.lock') }}

      - name: CocoaPods install
        working-directory: client/iosApp
        run: pod install

      - name: Cache Mint packages (pinned lint tools)
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: mint-${{ hashFiles('client/Mintfile') }}

      - name: Install pinned lint tools
        run: |
          brew install mint
          mint bootstrap

      - name: Indexed build for Periphery (report-only)
        working-directory: client/iosApp
        continue-on-error: true
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -parallelizeTargets -jobs $(sysctl -n hw.ncpu)
          COMPILER_INDEX_STORE_ENABLE=YES
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build 2>&1 | tee ../../periphery-build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Periphery scan (report-only)
        continue-on-error: true
        run: mint run periphery scan --workspace iosApp/iosApp.xcworkspace --schemes iosApp --skip-build --config iosApp/.periphery.yml 2>&1 | tee periphery.log; test ${PIPESTATUS[0]} -eq 0

      - name: Upload Periphery logs (report-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-periphery-reports
          path: |
            client/periphery-build.log
            client/periphery.log
