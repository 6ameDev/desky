name: CI

# v2-branch only for now. Widen to main/all branches when v2 merges.
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

env:
  # platformio.ini injects this as a build macro; a dummy keeps CI hermetic.
  # CI-only test value, never a real secret. Production secrets stay in the
  # untracked embedded/.env, which CI never has (firmware builds fail loudly
  # without it, by design).
  DESKY_LINK_SECRET: 0123456789abcdef0123456789abcdef

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('embedded/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install lint tools (pinned to local gates)
        run: pip install clang-format==18.1.8 semgrep==1.182.1

      - name: Gate (format + firmware builds + host tests)
        working-directory: embedded
        run: make check
