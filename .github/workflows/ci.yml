name: CI

# v2-branch only for now. Widen to main/all branches when v2 merges.
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

env:
  # platformio.ini injects this as a build macro; a dummy keeps CI hermetic.
  # CI-only test value, never a real secret. Production secrets stay in the
  # untracked embedded/.env, which CI never has (firmware builds fail loudly
  # without it, by design).
  DESKY_LINK_SECRET: 0123456789abcdef0123456789abcdef

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('embedded/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install lint tools (pinned to local gates)
        run: pip install clang-format==18.1.8 semgrep==1.182.1

      - name: Gate (format + firmware builds + host tests)
        working-directory: embedded
        run: make check

      # Advisory only: none of these fail the firmware gate. The required
      # `make check` above stays untouched and gating. Tool installs are
      # best-effort (continue-on-error) — check-static members skip
      # gracefully when tools are absent.
      - name: Install optional analysis tools (best-effort, never gating)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck

      - name: Size report (advisory)
        working-directory: embedded
        continue-on-error: true
        run: make size-report > size-report.log 2>&1; CODE=$?; cat size-report.log; exit $CODE

      - name: Static analysis rollup (advisory)
        working-directory: embedded
        continue-on-error: true
        run: make check-static > check-static.log 2>&1; CODE=$?; cat check-static.log; exit $CODE

      - name: ASan host tests, core + head (advisory)
        working-directory: embedded
        continue-on-error: true
        run: |
          make -C core test-asan > asan-core.log 2>&1; C1=$?; cat asan-core.log
          make -C head test-asan > asan-head.log 2>&1; C2=$?; cat asan-head.log
          exit $((C1 || C2))

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-static-analysis
          path: |
            embedded/size-report.log
            embedded/check-static.log
            embedded/asan-core.log
            embedded/asan-head.log
