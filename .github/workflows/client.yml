name: Client (KMP)

# Same branch scope as the firmware gate for now.
on:
  push:
    branches: [v2]
    paths: [client/**, .github/workflows/client.yml]
  pull_request:
    branches: [v2]
    paths: [client/**, .github/workflows/client.yml]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform-36, build-tools 36.x)
        uses: android-actions/setup-android@v3

      - name: Unit tests + assemble (JVM tests, all shared targets, debug APK)
        run: ./gradlew :shared:jvmTest :shared:assemble :androidApp:assembleDebug --console=plain

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode + show simulators
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes

      - name: CocoaPods install (runs :shared framework sync via plugin hook)
        working-directory: client/iosApp
        run: pod install --repo-update

      - name: Build iosApp (simulator)
        working-directory: client/iosApp
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16'
          build
