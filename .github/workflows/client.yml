name: Client (KMP)

# Same branch scope as the firmware gate for now.
on:
  push:
    branches: [v2]
    paths: [client/**, .github/workflows/client.yml]
  pull_request:
    branches: [v2]
    paths: [client/**, .github/workflows/client.yml]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: android-actions/setup-android is intentionally NOT used — v3
      # hardcodes the long-removed `tools` SDK package, so its own sdkmanager
      # call exits 1 on current runners (proven by CI run 38587647316).
      # ubuntu runners preinstall the SDK at /usr/local/lib/android/sdk;
      # we only add the platform + build-tools this project pins.
      - name: Set up Android SDK (preinstalled + install platform-36)
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          CMDLINE_BIN=$(dirname "$(find $ANDROID_HOME/cmdline-tools -maxdepth 3 -name sdkmanager | head -1)")
          echo "$CMDLINE_BIN" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Unit tests + assemble (JVM tests, all shared targets, debug APK)
        run: ./gradlew :shared:jvmTest :shared:assemble :androidApp:assembleDebug --console=plain

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode + show simulators
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate shared podspec (gitignored; pod install needs it present)
        run: ./gradlew :shared:podspec --console=plain

      - name: CocoaPods install (framework syncs at Xcode build time via plugin hook)
        working-directory: client/iosApp
        run: pod install --repo-update

      - name: Build iosApp (simulator)
        working-directory: client/iosApp
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16'
          build
