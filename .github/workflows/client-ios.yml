name: Client – iOS

# Fires only when iOS-affecting files change (shared/ counts: it ships in
# the framework). Android-only edits never spend macOS minutes here (10x).
on:
  push:
    branches: [v2]
    paths: [client/iosApp/**, client/shared/**, client/gradle/libs.versions.toml, .github/workflows/client-ios.yml]
  pull_request:
    branches: [v2]
    paths: [client/iosApp/**, client/shared/**, client/gradle/libs.versions.toml, .github/workflows/client-ios.yml]

# A second push cancels the stale run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26: Xcode 26.6 / Swift 6.3.3, matching the dev machine. The
    # select step below asserts the version — a future image update that
    # moves the default fails loudly instead of silently drifting the gate.
    runs-on: macos-26
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache + daemon tuning
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode + show simulators
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q "^Xcode 26.6$" || { echo "Pinned Xcode 26.6 missing — bump runs-on and this assertion together, then triage any new diagnostics"; exit 1; }
          swift --version
          xcrun simctl list runtimes

      # podspec is gitignored; pod install needs it present AND its guard
      # needs a framework dir to exist — generateDummyFramework satisfies the
      # guard; the real framework syncs at Xcode build time via plugin hook.
      - name: Generate shared podspec + dummy framework
        run: ./gradlew :shared:podspec :shared:generateDummyFramework --console=plain

      - name: Cache CocoaPods (keyed by lockfile; skip on Podfile changes)
        uses: actions/cache@v6
        with:
          path: |
            client/iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('client/iosApp/Podfile.lock') }}

      # No --repo-update: the lockfile pins everything; the cache above makes
      # stable-Podfile installs seconds instead of a CDN round-trip per run.
      - name: CocoaPods install
        working-directory: client/iosApp
        run: pod install

      # Static analysis: Mint pins the tool versions (client/Mintfile, same
      # pattern as Podfile.lock). CI installs mint unpinned via brew (it
      # only fetches the pinned binaries) and caches the built packages
      # in ~/.mint.
      - name: Cache Mint packages (pinned lint tools)
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: mint-${{ hashFiles('client/Mintfile') }}

      - name: Install pinned lint tools
        run: |
          brew install mint
          mint bootstrap

      # Advisory until baselines are triaged (then promotes to gating).
      - name: SwiftLint (report-only)
        continue-on-error: true
        run: mint run swiftlint lint iosApp --config iosApp/.swiftlint.yml --reporter github-actions-logging 2>&1 | tee swiftlint.log; test ${PIPESTATUS[0]} -eq 0

      # --lint only: never writes in CI.
      - name: SwiftFormat check (report-only)
        continue-on-error: true
        run: mint run swiftformat --lint iosApp --config iosApp/.swiftformat 2>&1 | tee swiftformat.log; test ${PIPESTATUS[0]} -eq 0

      - name: Build iosApp (simulator)
        working-directory: client/iosApp
        # CI-only flags (never in the pbxproj: index-store off would kill
        # local Xcode intelligence): parallelize targets, all cores, skip
        # IndexStore. Generic platform destination: this job only compiles,
        # never launches, so it must not depend on whichever named devices
        # the image happens to ship (e.g. no iPhone 16 on macos-26 runners).
        # ARCHS=arm64: the Kotlin-built shared framework ships only the
        # arm64 slice, so an x86_64 compile would fall back to ObjC headers
        # and lose SKIE's AsyncSequence support.
        # Local `make ios` keeps the explicit iPhone 16 destination.
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -parallelizeTargets -jobs $(sysctl -n hw.ncpu)
          COMPILER_INDEX_STORE_ENABLE=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

      # Report-only: mirrors the simulator build above (identical
      # workspace/scheme/destination/flags, verb `analyze` instead of
      # `build`). continue-on-error keeps it advisory until a clean
      # baseline promotes it to gating.
      - name: Analyze iosApp (report-only)
        working-directory: client/iosApp
        continue-on-error: true
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -parallelizeTargets -jobs $(sysctl -n hw.ncpu)
          COMPILER_INDEX_STORE_ENABLE=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          analyze 2>&1 | tee ../../analyze.log; test ${PIPESTATUS[0]} -eq 0

      # No separate concurrency step: Swift 6 implies complete checking.
      - name: Upload static-analysis logs (report-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-lint-reports
          path: |
            client/swiftlint.log
            client/swiftformat.log
            client/analyze.log
