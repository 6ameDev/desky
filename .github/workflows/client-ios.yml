name: Client – iOS

# Fires only when iOS-affecting files change (shared/ counts: it ships in
# the framework). Android-only edits never spend macOS minutes here (10x).
on:
  push:
    branches: [v2]
    paths: [client/iosApp/**, client/shared/**, client/gradle/libs.versions.toml, .github/workflows/client-ios.yml]
  pull_request:
    branches: [v2]
    paths: [client/iosApp/**, client/shared/**, client/gradle/libs.versions.toml, .github/workflows/client-ios.yml]

# A second push cancels the stale run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache + daemon tuning
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode + show simulators
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes

      # podspec is gitignored; pod install needs it present AND its guard
      # needs a framework dir to exist — generateDummyFramework satisfies the
      # guard; the real framework syncs at Xcode build time via plugin hook.
      - name: Generate shared podspec + dummy framework
        run: ./gradlew :shared:podspec :shared:generateDummyFramework --console=plain

      - name: Cache CocoaPods (keyed by lockfile; skip on Podfile changes)
        uses: actions/cache@v6
        with:
          path: |
            client/iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('client/iosApp/Podfile.lock') }}

      # No --repo-update: the lockfile pins everything; the cache above makes
      # stable-Podfile installs seconds instead of a CDN round-trip per run.
      - name: CocoaPods install
        working-directory: client/iosApp
        run: pod install

      # Static analysis Phase 1 (issue 54, task 6): Mint pins the tool
      # versions (client/Mintfile, same pattern as Podfile.lock). CI installs
      # mint unpinned via brew (it only fetches the pinned binaries) and
      # caches the built packages in ~/.mint.
      - name: Cache Mint packages (pinned lint tools)
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: mint-${{ hashFiles('client/Mintfile') }}

      - name: Install pinned lint tools
        run: |
          brew install mint
          mint bootstrap

      # Advisory until baselines are triaged (task 9 promotes to gating).
      - name: SwiftLint (report-only)
        continue-on-error: true
        run: mint run swiftlint lint iosApp --config iosApp/.swiftlint.yml --reporter github-actions-logging

      # --lint only: never writes in CI.
      - name: SwiftFormat check (report-only)
        continue-on-error: true
        run: mint run swiftformat --lint iosApp --config iosApp/.swiftformat

      - name: Build iosApp (simulator)
        working-directory: client/iosApp
        # CI-only flags (never in the pbxproj: index-store off would kill
        # local Xcode intelligence): parallelize targets, all cores, skip
        # IndexStore, arm64-only destination.
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,arch=arm64'
          -parallelizeTargets -jobs $(sysctl -n hw.ncpu)
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      # Phase 0 report-only: mirrors the simulator build above (identical
      # workspace/scheme/destination/flags, verb `analyze` instead of
      # `build`). continue-on-error keeps it advisory until a clean
      # baseline promotes it to gating.
      - name: Analyze iosApp (report-only)
        working-directory: client/iosApp
        continue-on-error: true
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,arch=arm64'
          -parallelizeTargets -jobs $(sysctl -n hw.ncpu)
          COMPILER_INDEX_STORE_ENABLE=NO
          analyze

      # Phase 0 report-only: project pins SWIFT_VERSION=5.0 so
      # SWIFT_STRICT_CONCURRENCY=complete measures the minimal-check
      # surface until a Swift 6 migration decision. Advisory only.
      - name: Swift concurrency assessment (report-only)
        working-directory: client/iosApp
        continue-on-error: true
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,arch=arm64'
          -parallelizeTargets -jobs $(sysctl -n hw.ncpu)
          COMPILER_INDEX_STORE_ENABLE=NO
          SWIFT_STRICT_CONCURRENCY=complete
          build

  # Periphery rides a SEPARATE job: it needs the index store, but the main
  # build above keeps COMPILER_INDEX_STORE_ENABLE=NO (local Xcode
  # intelligence parity, faster CI). This job redoes setup through pod
  # install, builds once with the index store ON, then scans --skip-build.
  # Advisory until baselines are triaged (task 9 promotes to gating).
  periphery:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin, matches client/.mise.toml)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache + daemon tuning
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode + show simulators
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate shared podspec + dummy framework
        run: ./gradlew :shared:podspec :shared:generateDummyFramework --console=plain

      - name: Cache CocoaPods (keyed by lockfile; skip on Podfile changes)
        uses: actions/cache@v6
        with:
          path: |
            client/iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('client/iosApp/Podfile.lock') }}

      - name: CocoaPods install
        working-directory: client/iosApp
        run: pod install

      - name: Cache Mint packages (pinned lint tools)
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: mint-${{ hashFiles('client/Mintfile') }}

      - name: Install pinned lint tools
        run: |
          brew install mint
          mint bootstrap

      - name: Indexed build for Periphery (report-only)
        working-directory: client/iosApp
        continue-on-error: true
        run: >
          xcodebuild -workspace iosApp.xcworkspace -scheme iosApp
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,arch=arm64'
          -parallelizeTargets -jobs $(sysctl -n hw.ncpu)
          COMPILER_INDEX_STORE_ENABLE=YES
          build

      - name: Periphery scan (report-only)
        continue-on-error: true
        run: mint run periphery scan --workspace iosApp/iosApp.xcworkspace --schemes iosApp --skip-build --config iosApp/.periphery.yml
