; PlatformIO Project Configuration File — desky-testbench (component testbench).
;
; Project: desky-testbench
; MCU: ESP32 DevKit v1 (30-pin, classic ESP32-WROOM-32) — see
;   include/mcu/esp32_devkit_v1_30pin.h
; Framework: Arduino + FreeRTOS (see docs/architecture/v2.md)
; Role: stripped-down POC rig — Serial banner + I2C scan + LED blink.
;   Per-part tests land as temporary src/hal/<part>_poc.h files and are
;   deleted after the POC so the rig stays lean.
;
; Partitions: default (4MB flash, no OTA slots — test firmware is small).

; Shared ESP32 settings. Named [common] (not [env]) so the host
; native-test env does not inherit board/framework/lib_deps.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -I../shared
    -Wall
    -Wextra

; Strict for our code only — libs keep warnings-as-warnings.
build_src_flags =
    -Werror

; No libs on day one: banner + I2C scan + blink need Arduino only.
; Add per-part deps pinned exact (no ^ ranges, no bare .git URLs) when a
; POC needs them, and remove them when the POC lands or is retired.
lib_deps =

[env:desky-testbench]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D DESKY_TESTBENCH=1

; Host unit tests (laptop, no hardware). Bundled Unity framework.
; src/ is Arduino-coupled; tests include only Arduino-free headers directly.
[env:native-test]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -I../shared
    -Wall
    -Wextra
    -Werror
