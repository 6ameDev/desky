; PlatformIO Project Configuration File
;
; Project: desky-core (primary brain)
; MCU: ESP32-S3-WROOM-1-N16R8 DevKit — see include/mcu/esp32s3_wroom1_n16r8.h
; Framework: Arduino + FreeRTOS
;
; Partitions: default (OTA-capable 2x app slots on 16MB flash).

; Shared ESP32 settings. Named [common] (not [env]) so the host
; native-test env does not inherit board/framework/lib_deps.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Read environment variables during compilation and inject as C++ macros
build_flags =
    -I../shared
    -Wall
    -Wextra

; Strict for our code only — libs (e.g. Adafruit VL53L0X) keep warnings-as-warnings.
build_src_flags =
    -Werror

; Exact pins — S3 map in include/mcu/esp32s3_wroom1_n16r8.h. Bump deliberately.
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git#ded3e58b5cee1a4bff050b587d96a54261f792b1
    https://github.com/ESP32Async/AsyncTCP.git#fd296a703104463c841d8711de3d5f63ea8ffb14
    adafruit/Adafruit_VL53L0X @ 1.2.5
    https://github.com/bolderflight/invensense-imu.git#2255d746246e8f5d4a6269e68db1fcaaf34aaade
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit BusIO @ 1.17.4

[env:desky]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D DESKY_DEV=1
    -D DESKY_LINK_SECRET_HEX=${sysenv.DESKY_LINK_SECRET}

[env:desky-release]
extends = common
build_type = release
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_INFO
    -D DESKY_RELEASE=1
    -D DESKY_LINK_SECRET_HEX=${sysenv.DESKY_LINK_SECRET}

; Bench env: identical to desky (debug) except WiFi is compiled out at the
; main.cpp gate (DESKY_NO_WIFI=1 skips g_udp.begin). Deliberately NOT part of
; the `check` gate's required builds.
[env:desky-bench]
extends = env:desky
build_type = debug
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D DESKY_DEV=1
    -D DESKY_NO_WIFI=1
    -D DESKY_LINK_SECRET_HEX=${sysenv.DESKY_LINK_SECRET}

; Host unit tests (laptop, no hardware). Bundled Unity framework.
; src/ is Arduino-coupled; tests include only Arduino-free headers directly.
[env:native-test]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -I../shared
    # X-wire host tests include the head producer top half (wifi_link.h needs
    # head_context.h + transport/link_codec.h). Host-only; firmware envs above
    # are untouched.
    -I../head/include
    -I../head/src
    -Wall
    -Wextra
    -Werror

; Sanitizer run of the host tests (advisory — NOT in `make check`).
; Inherits native-test (test_build_src=false, so only test TUs + headers are
; instrumented). Needs -fsanitize at link too; build_flags flow into the
; native link line via the platform's LINKFLAGS handling — if the link fails
; on another host toolchain, add an extra_script exporting LINKFLAGS instead.
[env:native-asan]
extends = env:native-test
build_flags =
    ${env:native-test.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g3

; Coverage run of the host tests (advisory — NOT in `make check`).
; gcov-style counters (--coverage) so the Apple-shipped `xcrun llvm-cov gcov`
; can read the .gcda files with no lcov install. See `make coverage` and
; ../docs/static-analysis.md for the exact invocation.
[env:native-cov]
extends = env:native-test
extra_scripts = pre:../tools/pio_native_cov.py
build_flags =
    ${env:native-test.build_flags}
    --coverage
    -g3
    -O0
