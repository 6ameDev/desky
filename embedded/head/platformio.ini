; desky-head (face-unit, PARKED): ESP32-CAM + OV3660 + OLED + link stub.
; Partitions: custom OTA table (partitions_ota_nospiffs.csv), NO SPIFFS.
; Revisit slots when firmware.bin > ~1.2MB (ota::fitsSlot enforces the ceiling).
; Pin truth lives in include/mcu/esp32cam_ov3660.h.

; Named [common] (not [env]) so native-test never inherits board/framework.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -I../shared
    -Wall
    -Wextra

; Our code only; libs keep warnings-as-warnings.
build_src_flags =
    -Werror

; Display lib version pinned (single display stack: u8g2 full-buffer HW-I2C).
lib_deps =
    olikraus/U8g2 @ 2.36.18

[env:desky-head]
extends = common
build_type = debug
board_build.partitions = partitions_ota_nospiffs.csv
; Post-build: emit firmware.manifest next to firmware.bin (firmware envs only).
extra_scripts = post:tools/gen_fw_manifest.py
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D DESKY_HEAD=1

; Host unit tests (laptop, no hardware). Arduino-free headers only.
[env:native-test]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -I../shared
    -I../core/src
    -Wall
    -Wextra
    -Werror
