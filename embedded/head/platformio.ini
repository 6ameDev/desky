; PlatformIO Project Configuration File — desky-head (face-unit).
;
; Project: desky-head
; MCU: AI Thinker ESP32-CAM (classic ESP32, board = esp32cam) + OV3660 eyes.
; Role: face-unit — eyes OV3660 + face OLED + MCU + talk-wire.
; Smart lives in desky-core, drawings live here.
;
; Pin + power truth lives in include/mcu/esp32cam_ov3660.h (the lockfile
; half of this file): OLED SDA=GPIO14/SCL=GPIO15 (scan 0x3C/0x3D), link
; UART2 TX=GPIO12/RX=GPIO13 @115200, GPIO2/4 reserved, star 5V power.
; MB-board rule: the MB occupies ALL pins, so the OLED is never attached
; during USB runs (boot-scan negative path); the camera works on-MB.

; Shared settings. Named [common] (not [env]) so the host
; native-test env does not inherit board/framework.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -I../shared
    -Wall
    -Wextra

; Strict for our code only — libs keep warnings-as-warnings.
build_src_flags =
    -Werror

; Exact pins — display libs pinned to the SAME versions as desky-core
; (GFX + SSD1306 + BusIO move together via pin-bump PRs on both firmwares).
lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit BusIO @ 1.17.4

[env:desky-head]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D DESKY_HEAD=1

; Host unit tests (laptop, no hardware). Arduino-free headers only:
; tests include src headers directly (pure tops) + head_context.h.
[env:native-test]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -I../shared
    -Wall
    -Wextra
    -Werror
