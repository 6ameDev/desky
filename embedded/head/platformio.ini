; PlatformIO Project Configuration File — desky-head (face-unit) stub.
;
; Project: desky-head
; MCU: AI Thinker ESP32-CAM (classic ESP32, board = esp32cam).
; Role: face-unit — eyes OV3660 + face OLED + MCU + talk-wire.
; Smart lives in desky-core, drawings live here.
;
; Task 1: EMPTY shell only — boot banner, nothing else.
; No camera / OLED / UDP / UART code until tasks 2/3.
; Pin + power map (CAM GPIO14/15 talk-wire, OLED on 12/13, GPIO2/4
; reserved, star 5V power) lands with the task 2 bring-up, not here.

; Shared settings. Named [common] (not [env]) so the host
; native-test env does not inherit board/framework.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -Wall
    -Wextra

; Strict for our code only — libs keep warnings-as-warnings.
build_src_flags =
    -Werror

[env:desky-head]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -D DESKY_HEAD=1

; Host unit-test stub (no tests yet — head logic lands in task 2).
; Kept so the env shape mirrors core from day one.
[env:native-test]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -Wall
    -Wextra
    -Werror
