[versions]
kotlin = "2.4.21"
agp = "9.4.1"
ksp = "2.3.12"
room3 = "3.0.3"
sqlite = "2.7.1"
skie = "0.10.15"
coroutines = "1.11.0"
cryptography = "0.6.0"
koin = "4.2.2"
ktor = "3.6.0"
lifecycle = "2.8.7"
securityCrypto = "1.1.0"
composeBom = "2026.09.00"
navigation = "2.10.2"
activity = "1.13.0"
camerax = "1.4.2"
mlkitBarcodeScanning = "17.3.0"
turbine = "1.2.1"
mokkery = "3.5.1"
# Static analysis:
# - detekt 1.23.8 = latest stable 1.x (built: Kotlin 2.0.21, Gradle 8.12.1).
#   No stable 1.x runs natively on Kotlin 2.4; 2.0.x (Kotlin 2.4 native) is
#   alpha-only (2.0.0-alpha.6 @ Kotlin 2.4.10). Prefer stable 1.23.8 first and
#   promote to detekt 2.x stable once it ships.
detekt = "1.23.8"
# ktlint-gradle 14.2.0: latest stable, Gradle 9 + AGP 9 / new-DSL support.
ktlintGradle = "14.2.0"
# kover 0.9.11: latest stable, explicit Kotlin 2.4 support.
kover = "0.9.11"
# osv-scanner plugin 6.3.0: latest stable 6.x (portal, 18 Oct 2026). SARIF-native
# output, no NVD key, no token (advisory only).
osvScanner = "6.3.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-core-viewmodel = { group = "io.insert-koin", name = "koin-core-viewmodel", version.ref = "koin" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
# CameraX 1.4.2 (Mar 2025 stable): needs compileSdk 34-era APIs only —
# safe on compileSdk 36. Deliberately NOT 1.7.x alphas (those pull
# compileSdk 37, which this repo pins away from per the ktor-okhttp CAUTION).
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
# Bundled ML Kit barcode (model ships in the APK, scans fully offline —
# required: the robot AP has no internet, so the unbundled Play-downloaded
# model could miss its first download exactly when pairing matters; 17.3.0 is
# the current bundled release per ML Kit docs; no compileSdk 37 requirement).
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcodeScanning" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mokkery-core = { group = "dev.mokkery", name = "mokkery-core", version.ref = "mokkery" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
cryptography-core = { group = "dev.whyoleg.cryptography", name = "cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { group = "dev.whyoleg.cryptography", name = "cryptography-provider-optimal", version.ref = "cryptography" }
# Plugin implementation artifacts: build-logic's compile classpath for convention
# plugins (precompiled script plugins apply these by bare id(); versions stay here).
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
room3-gradle-plugin = { group = "androidx.room3", name = "room3-gradle-plugin", version.ref = "room3" }
skie-gradle-plugin = { group = "co.touchlab.skie", name = "gradle-plugin", version.ref = "skie" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
mokkery = { id = "dev.mokkery", version.ref = "mokkery" }
# Static analysis plugin declarations (gating state per module build file).
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
osv-scanner = { id = "com.fizzpod.osv-scanner", version.ref = "osvScanner" }
