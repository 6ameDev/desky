android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# parallel: overlap the 4 targets' Kotlin/KSP compiles (measured 2:48→2:33 on
# a full forced rebuild; stock tasks only, ~zero risk).
org.gradle.parallel=true
# Configuration cache: proven clean on this tree (totalProblemCount=0 across
# KMP + KSP + Room + SKIE + cocoapods + Mokkery + AGP, trialed 2026-10).
# Re-trial with problems=warn on major plugin upgrades.
org.gradle.configuration-cache=true
# kotlin.incremental.native: REMOVED 2026-10 — no measured local gain (toggle
# probe: 1m43s ON vs 0m55s OFF, gap explained by build-cache hits, i.e.
# inconclusive) and it is Beta with a stale-framework failure mode.
# Revisit only with an isolated measurement if incrementals ever hurt.
# Heap: deliberately stock (Gradle 4g, daemon inherits) — nothing ever OOM'd,
# and 6g+4g oversubscribed this 16 GB dev box (IDE + emulator/simulator share
# it). Size up from observed GC pressure only, never speculatively.
