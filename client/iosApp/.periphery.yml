# Advisory only. First run establishes a suppressible baseline; promotion
# to gating follows the checklist in client/ARCHITECTURE.md.
# Rationale: Pods/ is vendored third-party code; the `shared` framework
# referenced below is Kotlin-generated (SKIE) — its symbols are not
# hand-written Swift and would flood results with unactionable hits.
# Scan with: mint run periphery scan --skip-build
source:
  - iosApp/**/*.swift
exclude:
  - "Pods/**"
  - "*/Generated/**"
  - "**/shared.framework/**"
retain_public: false
