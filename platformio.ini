; PlatformIO Project Configuration File — desky v2 clean rewrite
;
; Project: desky
; MCU: ESP32 DevKit v1 (30-pin) — see include/mcu/esp32_devkit_v1_30pin.h
; Framework: Arduino + FreeRTOS (see docs/architecture/v2.md)
;
; Partitions: default (OTA-capable 2x app slots on 4MB flash).
; Tripwire: revisit (huge_app/custom CSV) when firmware.bin > 1MB.

; Shared ESP32 settings. Named [common] (not [env]) so the host
; native-test env does not inherit board/framework/lib_deps.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Read environment variables during compilation and inject as C++ macros
build_flags =
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -Wall
    -Wextra

; Strict for our code only — libs (e.g. Adafruit VL53L0X) keep warnings-as-warnings.
build_src_flags =
    -Werror

; Exact pins — verified building 2026-09-19. Bump deliberately via pin-bump PRs.
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git#ded3e58b5cee1a4bff050b587d96a54261f792b1
    https://github.com/ESP32Async/AsyncTCP.git#fd296a703104463c841d8711de3d5f63ea8ffb14
    adafruit/Adafruit_VL53L0X @ 1.2.5
    https://github.com/bolderflight/invensense-imu.git#2255d746246e8f5d4a6269e68db1fcaaf34aaade
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit BusIO @ 1.17.4

[env:desky]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D DESKY_DEV=1

[env:desky-release]
extends = common
build_type = release
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_INFO
    -D DESKY_RELEASE=1

; STA test env (Workstream B): robot joins the home router via .env
; WIFI_SSID/WIFI_PASS so the laptop keeps internet + robot reachability on
; one network. Default (desky/desky-release) builds stay AP mode.
; NOTE: the selector is DESKY_WIFI_STA, not WIFI_MODE_STA — the latter is
; already an ESP-IDF wifi_mode_t enum pulled in by <WiFi.h>, so -D'ing it
; breaks the WiFi headers themselves.
[env:desky-sta]
extends = env:desky
build_type = debug
build_flags =
    ${common.build_flags}
    -D LOG_LEVEL=LOG_LEVEL_DEBUG
    -D DESKY_DEV=1
    -D DESKY_WIFI_STA=1

; Host unit tests (laptop, no hardware). Bundled Unity framework.
; src/ is Arduino-coupled; tests include only Arduino-free headers directly.
[env:native-test]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -Wall
    -Wextra
    -Werror
