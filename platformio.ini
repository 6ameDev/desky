; PlatformIO Project Configuration File — desky v2 clean rewrite
;
; Project: desky
; MCU: ESP32 DevKit v1 (30-pin) — see include/mcu/esp32_devkit_v1_30pin.h
; Framework: Arduino + FreeRTOS (see docs/architecture/v2.md)

[env:desky]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Read environment variables during compilation and inject as C++ macros
build_flags =
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -D LOG_LEVEL=LOG_LEVEL_DEBUG

; Auto-downloaded dependencies (pinned from V1 main branch)
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
    adafruit/Adafruit_VL53L0X @ ^1.2.5
    https://github.com/bolderflight/invensense-imu.git#v6.0.3
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit BusIO @ ^1.17.1
